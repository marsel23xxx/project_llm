[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Asisten analisis data berbasis AI agent untuk pengguna berbahasa Indonesia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "anthropic>=0.70",
    "langgraph>=1.0",
    "sqlglot>=26",
    # Must match the version the models in backend/models were trained with (ml/.venv).
    "scikit-learn==1.9.1",
    "joblib>=1.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Only needed to serve the IndoBERT ONNX export (backend/models/sentiment_onnx).
onnx = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
