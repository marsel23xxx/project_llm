# Salin ke /etc/nginx/sites-available/agentic-data-analyst lalu ganti DOMAIN_KAMU.
# Certbot akan menambahkan bagian HTTPS (port 443) ke file ini secara otomatis.
server {
    listen 80;
    server_name DOMAIN_KAMU;

    # Batas upload dataset (backend juga membatasi 50 MB).
    client_max_body_size 55m;

    # API langsung ke backend. Jawaban agent di-stream (SSE), jadi buffering dimatikan
    # dan batas waktu dinaikkan untuk LLM yang berjalan di CPU.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ditimpa (bukan ditambahkan) supaya pengunjung tidak bisa memalsukan alamat IP-nya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
